<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Event</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea, #764ba2);
            padding: 30px 20px;
        }

        .header {
            max-width: 900px;
            margin: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 25px;
        }

        .logo {
            color: white;
            font-size: 20px;
            font-weight: bold;
        }

        .back {
            color: white;
            text-decoration: none;
            font-weight: bold;
        }

        .form-box {
            max-width: 700px;
            margin: auto;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.25);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #667eea;
            font-weight: bold;
            margin-bottom: 30px;
        }

        label {
            display: block;
            color: #444;
            font-weight: bold;
            margin-bottom: 7px;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 9px;
            font-size: 15px;
            margin-bottom: 20px;
            outline: none;
        }

        input:focus,
        textarea:focus {
            border-color: #667eea;
        }

        textarea {
            height: 110px;
            resize: vertical;
        }

        .deadline-note {
            color: #777;
            font-size: 13px;
            margin-top: -12px;
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 9px;
            background: #667eea;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #5568d9;
        }

        .footer {
            text-align: center;
            color: white;
            margin-top: 25px;
            font-size: 13px;
        }

        @media (max-width: 600px) {
            .form-box {
                padding: 30px 20px;
            }

            .header {
                padding: 0 5px;
            }
        }
    </style>
</head>

<body>

    <div class="header">
        <div class="logo">
            🔐 College Event Management
        </div>

        <a href="/admin/dashboard" class="back">
            ← Dashboard
        </a>
    </div>

    <div class="form-box">

        <h1>➕ Add New Event</h1>

        <div class="subtitle">
            Dr.MGR Educational And Research Institute
        </div>

        <form method="POST" action="/admin/add-event">

            <label>
                Event Name
            </label>

            <input
                type="text"
                name="name"
                placeholder="Enter event name"
                required
            >

            <label>
                Date
            </label>

            <input
                type="text"
                name="date"
                placeholder="Example: 22-09-2026"
                required
            >

            <label>
                Time
            </label>

            <input
                type="text"
                name="time"
                placeholder="Example: 10:00 AM"
                required
            >

            <label>
                Venue
            </label>

            <input
                type="text"
                name="venue"
                placeholder="Enter venue"
                required
            >

            <label>
                Registration Deadline
            </label>

            <input
                type="date"
                name="registration_deadline"
                required
            >

            <div class="deadline-note">
                Students can register only until this date.
            </div>
<label>
    Event Capacity
</label>

<input
    type="number"
    name="capacity"
    min="1"
    placeholder="Enter maximum number of students"
    required
>
            <label>
                Description
            </label>

            <textarea
                name="description"
                placeholder="Enter event description"
            ></textarea>

            <button type="submit">
                ➕ Add Event
            </button>

        </form>
    </div>

    <div class="footer">
        © 2026 Dr.MGR Educational And Research Institute
    </div>

</body>
</html>
