<!DOCTYPE html><html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Event</title><style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        margin: 0;
        padding: 0;
    }

    .container {
        width: 90%;
        max-width: 650px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
    }

    h1 {
        text-align: center;
        margin-bottom: 25px;
    }

    label {
        display: block;
        margin-top: 15px;
        margin-bottom: 6px;
        font-weight: bold;
    }

    input,
    textarea,
    select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
    }

    textarea {
        height: 100px;
        resize: vertical;
    }

    button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        background: #2563eb;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
    }

    button:hover {
        background: #1d4ed8;
    }

    .back {
        display: block;
        text-align: center;
        margin-top: 15px;
        text-decoration: none;
        color: #2563eb;
    }
</style>

</head><body><div class="container"><h1>Edit Event</h1>

<form method="POST">

    <label>Event Name</label>
    <input
        type="text"
        name="name"
        value="{{ event['name'] }}"
        required
    >

    <label>Date</label>
    <input
        type="date"
        name="date"
        value="{{ event['date'] }}"
        required
    >

    <label>Time</label>
    <input
        type="text"
        name="time"
        value="{{ event['time'] }}"
        required
    >

    <label>Venue</label>
    <input
        type="text"
        name="venue"
        value="{{ event['venue'] }}"
        required
    >

    <label>Description</label>
    <textarea name="description">{{ event['description'] or '' }}</textarea>

    <label>Registration Deadline</label>
    <input
        type="date"
        name="registration_deadline"
        value="{{ event['registration_deadline'] or '' }}"
    >

    <label>Registration Status</label>
    <select name="registration_open">
        <option value="1" {% if event['registration_open'] == 1 %}selected{% endif %}>
            Open
        </option>

        <option value="0" {% if event['registration_open'] == 0 %}selected{% endif %}>
            Closed
        </option>
    </select>

    <button type="submit">Update Event</button>

</form>

<a class="back" href="/admin/events">← Back to Manage Events</a>

</div></body>
</html>
